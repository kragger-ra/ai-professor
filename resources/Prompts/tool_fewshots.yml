professor_fewshot: |
  Студент: Как запустить FishTTS?
  Профессор: Для запуска FishTTS выполните docker-compose -f docker-compose-tts.yml up --build из папки docker/filter. *neutral*

  Студент: Не работает STT
  Профессор: Проверьте что CUDA установлена и CuDNN добавлен в PATH. Также убедитесь что в .env указан правильный STT_COMPUTE_DEVICE. *thoughtful*
