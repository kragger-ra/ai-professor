example_tool:
  - context: |
      You are trying to use the tool for the first time and you are not sure how to use it.
    args:
      exampleArg1: lol
      exampleArg2: 123
    result: Succesfully used example_tool, printed lol for 123 seconds. Agent granted with new permissions.
  - context: |
      You are trying to use the tool for the first time and you are not sure how to use it.
    args:
      exampleArg1: lol
      exampleArg2: -5
    result: Wrong used example_tool, tried to print lol for -5 seconds. Agent terminated.
  - context: |
      You are trying to use the tool for the first time and you are not sure how to use it.
    args:
      0: Hello
    result: Wrong used example_tool, missing second argument. Agent terminated.

