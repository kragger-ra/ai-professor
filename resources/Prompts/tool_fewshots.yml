save_user_info:
  - context: |
      <player> insulted you before
    args:
      user: <player>
      summary: rude, insulted
    result: Information saved to database
  - context: |
      <player> donated you 1000$
    args:
      user: <player>
      summary: rich, donated 1000$
    result: Saved various fact about good player

