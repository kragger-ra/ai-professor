[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-professor-tutor"
version = "2.0.5"
description = "AI Professor — voice-based teaching assistant (Tutor build for individual study)"
readme = "README.md"
requires-python = ">=3.10.0,<3.11.0"
dependencies = [
    "cyrtranslit~=1.1.1",
    "faiss-cpu~=1.12.0",
    "flask~=3.1.2",
    "gradio~=5.49.1",
    "langchain-community~=0.3.31",
    "langchain-litellm~=0.3.0",
    "langchain-openai~=0.3.35",
    "langchain-text-splitters~=0.3.11",
    "librosa~=0.11.0",
    "onnxruntime~=1.23.1",
    "mss~=10.1.0",
    "dotenv~=0.9.9",
    "pip~=25.2",
    "pygame~=2.6.1",
    "python-dotenv~=1.1.1",
    "python-socketio~=5.14.2",
    "setuptools==80.0.0",
    "soundcard~=0.4.5",
    "sounddevice~=0.5.1",
    "typing-extensions~=4.15.0",
    "websocket-client~=1.9.0",
    "websockets~=15.0.1",
]

[dependency-groups]
dev = [
    "black~=25.9.0",
    "isort~=7.0.0",
    "pytest~=8.3",
    "pytest-bdd~=8.1",
]
simpletts = [
    "edge-tts~=6.1.9",
    "vosk-tts~=0.3.61",
    "scipy~=1.15.3",
    "fastapi~=0.115",
    "uvicorn~=0.32",
    "stressrnn",
    "num2words~=0.5",
]
stt = [
    "faster-whisper~=1.2.0",
]
gpu = [
    "onnxruntime-gpu~=1.23.2"
]
[project.scripts]
ai-professor-tutor = "tutor.app:main"

[tool.setuptools.packages.find]
include = ["tutor*"]

[tool.uv]
package = true
default-groups = ["dev", "stt"]

[tool.uv.sources]
stressrnn = { git = "https://github.com/Desklop/StressRNN.git" }
